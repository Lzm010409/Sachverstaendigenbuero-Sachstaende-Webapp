<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3B4CC0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#2A3042" media="(prefers-color-scheme: dark)" />
<title>Sachstands-Cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6DB3'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3EGS%3C/text%3E%3C/svg%3E" />
<style>
  /*
   * Farbschema in Anlehnung an Skote: Indigo als Akzent, kühle Blaugrau-Flächen.
   *
   * Bindende Vorgabe, keine Geschmacksfrage: Jede Textfarbe erreicht auf jeder
   * Fläche, auf der sie vorkommt, mindestens 4,5:1 nach WCAG 2.1 — auch
   * --text-faint, das bei 11-12 px für Beschriftungen und Datumsangaben
   * verwendet wird. Die Vorgängerfassung lag dort bei 3,59:1; das bestand die
   * Norm formal (unter 3:1 nur für große Schrift), war bei dieser Schriftgröße
   * im Dunkelmodus aber schlicht nicht lesbar.
   *
   * Wer hier Werte ändert, prüft sie vorher nach — sonst kehrt genau das
   * zurück. Verhältnis = (heller+0,05)/(dunkler+0,05) über die relative
   * Leuchtdichte.
   */
  :root {
    --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F0F2F9; --surface-3: #E4E8F4;
    --border: #DCE0EE; --border-strong: #BFC6DC; --text: #191D28; --text-muted: #4F5668;
    --text-faint: #5F6679; --accent: #3B4CC0; --accent-soft: #E9ECFB; --accent-ink: #FFFFFF;
    --critical: #B93A34; --critical-soft: #FBE9E8; --warn: #7E5209; --warn-soft: #FAEFD6;
    --ok: #136D52; --ok-soft: #E0F3ED;
    --shadow: 0 1px 2px rgba(25,29,40,.05), 0 8px 24px rgba(25,29,40,.07);
    --radius: 10px; --radius-sm: 7px;
    --font-ui: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #222736; --surface: #2A3042; --surface-2: #323A4F; --surface-3: #3C4560;
      --border: #3E4763; --border-strong: #556080; --text: #F6F7FB; --text-muted: #BCC6E0;
      --text-faint: #9BA7C6; --accent: #98A5F9; --accent-soft: #2E3555; --accent-ink: #141828;
      --critical: #FA9C9C; --critical-soft: #3C2830; --warn: #F7CA74; --warn-soft: #3B3320;
      --ok: #5DD9AA; --ok-soft: #1E3B32;
      --shadow: 0 1px 2px rgba(0,0,0,.28), 0 10px 30px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="light"] {
    --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F0F2F9; --surface-3: #E4E8F4;
    --border: #DCE0EE; --border-strong: #BFC6DC; --text: #191D28; --text-muted: #4F5668;
    --text-faint: #5F6679; --accent: #3B4CC0; --accent-soft: #E9ECFB; --accent-ink: #FFFFFF;
    --critical: #B93A34; --critical-soft: #FBE9E8; --warn: #7E5209; --warn-soft: #FAEFD6;
    --ok: #136D52; --ok-soft: #E0F3ED;
    --shadow: 0 1px 2px rgba(25,29,40,.05), 0 8px 24px rgba(25,29,40,.07);
  }
  :root[data-theme="dark"] {
    --bg: #222736; --surface: #2A3042; --surface-2: #323A4F; --surface-3: #3C4560;
    --border: #3E4763; --border-strong: #556080; --text: #F6F7FB; --text-muted: #BCC6E0;
    --text-faint: #9BA7C6; --accent: #98A5F9; --accent-soft: #2E3555; --accent-ink: #141828;
    --critical: #FA9C9C; --critical-soft: #3C2830; --warn: #F7CA74; --warn-soft: #3B3320;
    --ok: #5DD9AA; --ok-soft: #1E3B32;
    --shadow: 0 1px 2px rgba(0,0,0,.28), 0 10px 30px rgba(0,0,0,.32);
  }

  /* Dem Browser das Schema mitteilen. Ohne diese Angabe verwendet er für
     Bedienelemente, Rollbalken und Textfelder weiter die hellen
     Systemvorgaben, während unsere Variablen schon dunkel sind — daraus
     entstehen schwarze Schrift auf dunklem Grund und weiße Rollbalken. */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .app { display: flex; flex-direction: column; height: 100vh; }
  header.appbar { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #123)); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; letter-spacing: .5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.1px; }
  .brand .sub { font-size: 11.5px; color: var(--text-faint); margin: 0; }
  .kpis { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .kpi { display: flex; align-items: baseline; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  .kpi b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11.5px; color: var(--text-muted); }
  .kpi.crit b { color: var(--critical); }
  .kpi.warn b { color: var(--warn); }
  .appbar .date { font-size: 12px; color: var(--text-muted); }
  .badge-demo { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); background: var(--warn-soft); padding: 3px 9px; border-radius: 999px; }
  .theme-toggle { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; display: grid; place-items: center; }
  .theme-toggle:hover { border-color: var(--border-strong); color: var(--text); }

  .work { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  .list-pane { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .list-head { padding: 13px 16px 11px; display: flex; flex-direction: column; gap: 11px; border-bottom: 1px solid var(--border); }
  .list-head .title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; }
  .filters button:hover { border-color: var(--border-strong); color: var(--text); }
  .filters button.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

  /* color: var(--text) ist Pflicht, nicht Kosmetik. Ohne die Angabe erbt das
     <button> keine Textfarbe, sondern nimmt die Vorgabe des Browsers für
     Schaltflächen — gemessen rgb(0,0,0). Auf dunklem Grund ergab das 1,6:1;
     die Fallnamen in der Liste waren praktisch schwarz auf dunkelblau. */
  .case { text-align: left; width: 100%; font: inherit; color: var(--text); cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--stripe, var(--border-strong)); border-radius: var(--radius-sm); padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; transition: border-color .12s, background .12s; }
  .case:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .case.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  /* Erledigte Fälle sollen zurücktreten, aber lesbar bleiben: Sie stehen nach
     der Freigabe noch Stunden in der Liste, damit nachvollziehbar ist, was
     gerade bearbeitet wurde. Mit opacity: .5 fiel der Name auf 1,6:1 — die
     Dämpfung übernehmen jetzt Fläche und Textfarbe statt Transparenz. */
  .case.done { background: var(--surface-2); border-left-color: var(--border-strong); }
  .case.done .name { color: var(--text-muted); font-weight: 600; }
  .case.done .az, .case.done .recip { color: var(--text-faint); }
  .case .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .case .az { font-size: 12px; color: var(--text-muted); }
  .case .name { font-weight: 640; font-size: 14px; letter-spacing: -.1px; }
  .case .recip { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case .row3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .case .wait { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* Die Farbe folgt der HANDLUNG, nicht der Sachlage. „Klären" ist rot, weil es
     das Einzige ist, was ohne eine Eingabe in Pipedrive stehenbleibt; vorher war
     es grau und ging in der Liste unter. */
  .chip.pruefen { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chip.klaeren { color: var(--critical); background: var(--critical-soft); border-color: transparent; }
  .chip.abschliessen { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.ruht { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.skipped { color: var(--text-muted); background: var(--surface-3); border-color: transparent; }
  .chip.sent { color: var(--ok); background: var(--ok-soft); border-color: transparent; }

  /* Die Sachlage steht bewusst unauffällig daneben: Sie erklärt die Handlung,
     sie konkurriert nicht mit ihr. */
  .lage { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  /* Der Hinweis bei „Klären" ist kein Fehler, sondern eine Arbeitsanweisung —
     deshalb ruhig eingefasst und nicht als Alarm. */
  /* Der Weg nach Pipedrive ist ein Link, sieht aber aus wie eine Schaltfläche —
     ohne diese Zeile bekäme er zusätzlich die Unterstreichung eines Links. */
  a.btn { text-decoration: none; }
  .klaerhinweis { font-size: 13px; line-height: 1.5; color: var(--text); background: var(--critical-soft);
    border: 1px solid transparent; border-radius: var(--radius-sm); padding: 11px 13px; }
  .dhead .lage { font-size: 12px; }

  .detail { overflow-y: auto; min-height: 0; padding: 22px 26px 40px; }
  /* Detailansicht als Raster: der Kopf spannt über die ganze Breite, darunter
     stehen Kontext und Entwurf. Schmale Fenster stapeln, breite stellen sie
     nebeneinander — so bleibt der Entwurf beim Lesen der Korrespondenz im Blick. */
  .detail-inner {
    max-width: 1320px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start;
  }
  .detail-inner > .dhead { grid-column: 1 / -1; }
  .ctx, .draftCol { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  /* Ab dieser Breite lohnt die Zweiteilung. Der Entwurf bekommt eine feste,
     angenehme Textbreite, der Kontext den Rest. */
  @media (min-width: 1180px) {
    /* Kontext etwas breiter als der Entwurf — dort steht der Mailverlauf,
       der die längeren Zeilen hat. Beide Spalten skalieren mit dem Fenster. */
    .detail-inner { grid-template-columns: minmax(0, 1.15fr) minmax(380px, 1fr); }
    /* Entwurf bleibt beim Scrollen des Kontexts sichtbar. */
    .draftCol { position: sticky; top: 0; }
    /* Steht dort kein Entwurf, sondern der Mailverlauf, wäre Kleben störend —
       man will darin scrollen. Beide Spalten sind dann gleich breit. */
    .detail-inner:has(> .draftCol.frei) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .draftCol.frei { position: static; }
    .draftCol textarea.editor { min-height: 320px; }
  }
  .dhead { display: flex; flex-direction: column; gap: 9px; }
  .dhead .toprow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dhead h2 { margin: 0; font-size: 21px; letter-spacing: -.3px; font-weight: 680; text-wrap: balance; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .meta-grid .cell { background: var(--surface); padding: 9px 13px; }
  .meta-grid .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 600; }
  .meta-grid .v { font-size: 13px; margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card > .card-head { display: flex; align-items: center; gap: 9px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .card-head .h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 650; }
  .card-head .badge { margin-left: auto; font-size: 11.5px; color: var(--text-muted); }

  .callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); align-items: flex-start; }
  .callout .ic { font-size: 17px; line-height: 1.3; }
  .callout .t { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 650; margin-bottom: 3px; }
  .callout .b { font-size: 13.5px; color: var(--text); }
  .callout.info { background: var(--accent-soft); border-color: transparent; }
  .callout.info .t { color: var(--accent); }
  .callout.warn { background: var(--warn-soft); border-color: transparent; }
  .callout.warn .t { color: var(--warn); }
  .callout.ok { background: var(--ok-soft); border-color: transparent; }
  .callout.ok .t { color: var(--ok); }

  .thread { padding: 6px 16px 14px; display: flex; flex-direction: column; }
  .msg { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 11px 0; }
  .msg:not(:last-child) { border-bottom: 1px dashed var(--border); }
  .msg .rail { display: flex; flex-direction: column; align-items: center; }
  .msg .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; border: 2px solid var(--surface); }
  .msg.out .dot { background: var(--accent); }
  .msg.in .dot { background: var(--warn); }
  .msg .who { font-size: 12.5px; font-weight: 640; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .msg .who .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 4px; }
  .msg.out .tag { background: var(--accent-soft); color: var(--accent); }
  .msg.in .tag { background: var(--warn-soft); color: var(--warn); }
  .msg .when { font-size: 11.5px; color: var(--text-faint); font-weight: 400; }
  .msg .snippet { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  /* Leseansicht: Notizen und Nachrichten in Ruhe und in voller Länge lesen.
     Der Auszug in der Liste bleibt kurz, damit der Verlauf überschaubar ist;
     ein Klick öffnet den ganzen Text groß darüber. */
  .leser { position: fixed; inset: 0; z-index: 60; display: none; }
  .leser.auf { display: block; }
  .leser .hintergrund { position: absolute; inset: 0; background: rgba(10,14,20,.62); }
  .leser .blatt {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: max(24px, env(safe-area-inset-top)); bottom: max(24px, env(safe-area-inset-bottom));
    width: min(860px, calc(100vw - 32px));
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 14px; box-shadow: 0 24px 64px rgba(10,14,20,.35); overflow: hidden;
  }
  .leser .kopf { display: flex; align-items: flex-start; gap: 12px; padding: 15px 18px;
    border-bottom: 1px solid var(--border); }
  .leser .kopf h3 { margin: 0; font-size: 16px; font-weight: 650; }
  .leser .kopf .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .leser .zu { margin-left: auto; flex: none; background: none; border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 8px; font-size: 17px; line-height: 1;
    width: 34px; height: 34px; cursor: pointer; }
  .leser .zu:hover { color: var(--text); border-color: var(--border-strong); }
  .leser .rumpf { padding: 18px; overflow-y: auto; flex: 1;
    font-size: 15px; line-height: 1.68; white-space: pre-wrap; overflow-wrap: anywhere; }
  .leser .fuss { padding: 10px 18px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--text-faint); }
  @media (max-width: 720px) {
    .leser .blatt { top: 0; bottom: 0; width: 100vw; border-radius: 0; border: 0; }
    .leser .rumpf { font-size: 16px; padding: 15px; }
  }

  /* Anklickbare Zeilen in Notizen und Mailverlauf. */
  .oeffnen { cursor: pointer; }
  .oeffnen:hover { background: var(--surface-2); }
  .mehrHinweis { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 5px; }

  /* Aufklappbarer Volltext: Notizen und Mails sind in der Übersicht gekürzt,
     lassen sich aber vollständig ansehen, ohne nach Pipedrive zu wechseln. */
  .mehr { margin-top: 5px; }
  .mehr > summary { cursor: pointer; display: inline-block; font-size: 12px; font-weight: 600;
    color: var(--accent); list-style: none; padding: 3px 0; }
  .mehr > summary::-webkit-details-marker { display: none; }
  .mehr > summary::before { content: "▸ "; }
  .mehr[open] > summary::before { content: "▾ "; }
  .mehr[open] > summary { margin-bottom: 4px; }
  .volltext { font-size: 13px; line-height: 1.55; color: var(--text); white-space: pre-wrap;
    overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; max-height: 420px; overflow-y: auto; }
  /* Ergebniskarte nach der Entscheidung: eine Zeile je Schritt, damit auf
     einen Blick klar ist, was angelegt wurde und was noch aussteht. */
  .ergListe { padding: 4px 0; }
  .erg { display: flex; gap: 11px; padding: 11px 16px; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .erg:last-child { border-bottom: 0; }
  .erg .mark { font-size: 14px; line-height: 1.45; width: 16px; flex: none; text-align: center; }
  .erg.ok .mark { color: var(--ok); }
  .erg.warn .mark { color: var(--warn); }
  .erg.neutral .mark { color: var(--text-faint); }
  .erg .et { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 650; color: var(--text-faint); }
  .erg .eb { font-size: 13.5px; color: var(--text); margin-top: 2px; overflow-wrap: anywhere; }
  .erg .eb a { color: var(--accent); font-weight: 600; }
  .erg .nachholen { margin-top: 8px; font-size: 12.5px; padding: 6px 12px; }
  .erg .nachholen[disabled] { opacity: .7; cursor: default; }

  .notiz { padding: 11px 16px; border-bottom: 1px solid var(--border); }
  .notiz:last-child { border-bottom: 0; }
  .notiz .when { font-size: 11.5px; color: var(--text-faint); }
  .notiz .snippet { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  /* Ist der Volltext aufgeklappt, verschwindet die gekürzte Fassung darüber —
     sonst steht derselbe Anfang zweimal untereinander. Kann ein Browser :has()
     nicht, bleiben beide sichtbar; unschön, aber nichts geht verloren. */
  .notiz:has(details.mehr[open]) > .snippet,
  .msg:has(details.mehr[open]) .snippet { display: none; }

  .draft-wrap { padding: 4px 16px 16px; }
  .draft-to { display: flex; align-items: center; gap: 8px; padding: 10px 2px; font-size: 13px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .draft-to .lbl { color: var(--text-faint); width: 62px; }
  .draft-to .addr { color: var(--text); }
  .draft-to .pill { font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; color: var(--text-muted); }
  textarea.editor { width: 100%; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.62; padding: 15px 16px; resize: vertical; min-height: 250px; }
  textarea.editor:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }

  .rewrite { margin-top: 12px; display: none; flex-direction: column; gap: 9px; padding: 13px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .rewrite.open { display: flex; }
  .rewrite label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .rewrite .inrow { display: flex; gap: 8px; }
  .rewrite input { flex: 1; font: inherit; font-size: 13px; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
  .rewrite input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .rewrite .hints { display: flex; gap: 6px; flex-wrap: wrap; }
  .rewrite .hints button { font: inherit; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; border: 1px dashed var(--border-strong); background: transparent; color: var(--text-muted); cursor: pointer; }
  .rewrite .hints button:hover { border-style: solid; color: var(--text); }

  .actions { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  .btn { font: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 17px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 8px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:not(:disabled):hover { filter: brightness(1.07); }
  .btn.ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--border-strong); }
  .btn.subtle { background: transparent; color: var(--text-muted); }
  .btn.subtle:hover { color: var(--text); background: var(--surface-2); }
  .actions .spacer { flex: 1; }
  .actions .note { font-size: 11.5px; color: var(--text-faint); }

  .empty { display: grid; place-items: center; height: 100%; color: var(--text-faint); text-align: center; padding: 40px; }

  .toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
  .toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 12px 15px; min-width: 260px; max-width: 360px; display: flex; gap: 11px; align-items: flex-start; animation: slidein .22s ease; }
  .toast.warn { border-left-color: var(--warn); }
  .toast.info { border-left-color: var(--accent); }
  .toast.err { border-left-color: var(--critical); }
  .toast .ic { font-size: 16px; }
  .toast .tt { font-size: 13px; font-weight: 640; }
  .toast .tb { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  @keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* Kompakte Kennzahlen-Zeile: nur am Handy, dort ersetzt sie die Pillen. */
  #kpisCompact { display: none; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* Zurück-Knopf: nur mobil in der Detailansicht */
  .backBtn {
    display: none; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); border-radius: 9px; width: 44px; height: 44px; min-width: 44px;
    font-size: 26px; line-height: 1; cursor: pointer; padding: 0 0 3px 0;
  }
  .backBtn:active { background: var(--surface-3); }

  /* ---------------- Handy und kleine Tablets ----------------
     Kein geteilter Bildschirm: Liste und Detail sind zwei Ansichten.
     Umgeschaltet über data-view am .app-Element. */
  @media (max-width: 860px) {
    html, body { overflow-x: hidden; }
    .app { height: 100dvh; }               /* dvh: berücksichtigt Browserleisten */

    header.appbar {
      gap: 10px; padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      flex-wrap: nowrap; position: sticky; top: 0; z-index: 20;
    }
    .brand .sub { display: none; }          /* Platz sparen */
    .brand .mark { width: 30px; height: 30px; min-width: 30px; font-size: 12px; border-radius: 7px; }
    .brand h1 { font-size: 14px; white-space: nowrap; }
    .appbar .date { display: none; }
    #userBtn { padding: 0 9px !important; font-size: 12px; }
    .badge-demo { display: none; }

    /* Die Kennzahlen-Pillen passen auf 393 px nicht in die Kopfzeile und
       wurden abgeschnitten. Sie beschreiben ohnehin die Liste — dort stehen
       sie als kompakte Textzeile (#kpisCompact). */
    .kpis { display: none; }
    #kpisCompact { display: block; }
    .appbar .spacerMobile { margin-left: auto; }

    .work { grid-template-columns: minmax(0, 1fr); position: relative; }
    /* min-width: 0 ist hier entscheidend — sonst erzwingt der breiteste Inhalt
       die Spaltenbreite und Chips/Daten laufen aus dem Bild. */
    .list-pane, .detail { border-right: none; min-width: 0; }

    /* Genau eine Ansicht sichtbar */
    .app[data-view="list"] .detail { display: none; }
    .app[data-view="detail"] .list-pane { display: none; }
    .app[data-view="list"] .backBtn { display: none; }
    .app[data-view="detail"] .backBtn { display: grid; place-items: center; }

    .list-pane { max-height: none; }
    .list { padding: 8px 10px 12px; gap: 8px; }
    .list-head { padding: 10px 12px 10px; gap: 9px; }

    /* Filter: eine wischbare Zeile, nicht drei Zeilen Umbruch */
    .filters {
      flex-wrap: nowrap; overflow-x: auto; gap: 7px; padding-bottom: 2px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters button { flex: 0 0 auto; padding: 7px 14px; font-size: 12.5px; }

    /* Fall-Karten: größere Tippfläche */
    .case { padding: 13px 14px; gap: 7px; }
    .case .row1 { gap: 8px; }
    .case .az { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .case .chip { flex: 0 0 auto; }
    .case .row3 { gap: 8px; }
    .case .wait { white-space: nowrap; font-size: 11.5px; }
    .case .name { font-size: 15.5px; }
    .case .recip { font-size: 12.5px; white-space: normal; }

    .detail { padding: 14px 14px 0; }
    .detail-inner { gap: 15px; padding-bottom: 16px; grid-template-columns: minmax(0, 1fr); max-width: none; }
    .ctx, .draftCol { gap: 15px; }
    .draftCol { position: static; }
    .dhead h2 { font-size: 19px; }
    .dhead .toprow .date { display: inline; }
    .meta-grid { grid-template-columns: 1fr 1fr; }   /* nie schmaler als halb */
    .thread { padding: 4px 13px 12px; }
    .msg .snippet { font-size: 13.5px; }
    .draft-wrap { padding: 4px 13px 14px; }
    .draft-to .lbl { width: 54px; }

    /* 16px verhindert das automatische Zoomen von iOS beim Antippen */
    textarea.editor { font-size: 16px; line-height: 1.6; min-height: 46vh; padding: 14px; }
    .rewrite input { font-size: 16px; padding: 11px 13px; }
    .rewrite .hints button { padding: 7px 13px; font-size: 12.5px; }

    /* Aktionen fest am unteren Rand — in Daumenreichweite */
    .actions {
      position: sticky; bottom: 0; z-index: 15;
      margin: 0 -14px; padding: 11px 14px;
      padding-bottom: max(11px, env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--border);
      box-shadow: 0 -6px 18px rgba(0,0,0,.07);
      gap: 8px;
    }
    .actions .spacer { display: none; }
    .btn { padding: 13px 16px; font-size: 15px; min-height: 46px; }
    .btn.primary { flex: 1 1 auto; justify-content: center; }
    .btn.ghost { flex: 0 0 auto; }
    .btn.subtle { flex: 0 0 auto; padding: 13px 12px; }

    /* Hinweise über der Aktionsleiste, volle Breite */
    .toasts { left: 10px; right: 10px; bottom: calc(74px + env(safe-area-inset-bottom)); }
    .toast { min-width: 0; max-width: none; }
  }

  /* Sehr schmale Geräte (iPhone SE u. Ä.) — 393 px bleibt zweispaltig */
  @media (max-width: 360px) {
    .brand h1 { display: none; }            /* Logo genügt */
    .meta-grid { grid-template-columns: 1fr; }
    .btn.subtle { padding: 13px 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <button class="backBtn" id="backBtn" aria-label="Zurück zur Liste">‹</button>
    <div class="brand">
      <div class="mark">GS</div>
      <div>
        <h1>Sachstands-Cockpit</h1>
        <p class="sub">Kfz-Sachverständigenbüro Gollenstede</p>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <span class="badge-demo" id="demoBadge" hidden>Demo-Daten</span>
    <button class="theme-toggle" id="refreshBtn" title="Jetzt neu aus Pipedrive laden" aria-label="Aktualisieren" style="width:auto;padding:0 12px;">⟳</button>
    <span class="date" id="today"></span>
    <a class="theme-toggle" id="userBtn" href="/auth/logout" title="Abmelden"
       style="width:auto;padding:0 11px;text-decoration:none;display:none;align-items:center;"></a>
    <button class="theme-toggle" id="themeBtn" title="Hell/Dunkel umschalten" aria-label="Theme umschalten">◐</button>
  </header>

  <div class="work">
    <section class="list-pane">
      <div class="list-head">
        <span class="title">Sachstände</span>
        <span id="kpisCompact"></span>
        <span id="runInfo" style="font-size:11px;color:var(--text-faint);"></span>
        <span id="runWarn" hidden style="font-size:11.5px;font-weight:600;color:var(--warn);
          background:var(--warn-soft);border-radius:8px;padding:6px 9px;line-height:1.4;"></span>
        <div class="filters" id="filters">
          <button data-f="zutun" class="active">Zu tun</button>
          <button data-f="klaeren">Klären</button>
          <button data-f="ruht">Ruht</button>
          <button data-f="erledigt">Erledigt</button>
          <button data-f="alle">Alle</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section class="detail" id="detail">
      <div class="empty">Lade Fälle…</div>
    </section>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- Leseansicht für Notizen und Nachrichten in voller Länge -->
<div class="leser" id="leser" role="dialog" aria-modal="true" aria-labelledby="leserTitel">
  <div class="hintergrund" data-zu="1"></div>
  <div class="blatt">
    <div class="kopf">
      <div style="min-width:0">
        <h3 id="leserTitel"></h3>
        <div class="sub" id="leserSub"></div>
      </div>
      <button class="zu" id="leserZu" data-zu="1" aria-label="Schließen">✕</button>
    </div>
    <div class="rumpf" id="leserRumpf" tabindex="0"></div>
    <div class="fuss" id="leserFuss"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
